[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-examples"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastmcp==4.0.5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
time-mcp = "time_server.server:main"
geolocation-mcp = "geolocation_server.server:main"
gambling-mcp = "gambling_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]